name: release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  PACKAGE: stellar-oracle-shield

jobs:
  # Builds the contract and publishes the GitHub Release.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Install stellar-cli
        uses: stellar/stellar-cli@v27.0.0

      - name: Resolve version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          CRATE_VERSION=$(grep -m1 '^version = ' contracts/oracle-shield/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          # The released binary and the crate must claim the same version.
          if [ "${VERSION}" != "${CRATE_VERSION}" ]; then
            echo "::error::Tag v${VERSION} does not match the crate version (${CRATE_VERSION} in contracts/oracle-shield/Cargo.toml). Align them before tagging."
            exit 1
          fi
          echo "WASM=${PACKAGE}_v${VERSION}.wasm" >> "$GITHUB_ENV"

      - name: Build WASM
        run: |
          rustup update
          rustup target add wasm32v1-none
          stellar contract build --optimize \
            --package "${PACKAGE}" \
            --out-dir out \
            --meta source_repo="github:${{ github.repository }}"
          mv out/*.wasm "out/${WASM}"

      - name: Hash the WASM
        run: sha256sum "out/${WASM}" | tee "out/${WASM}.sha256"

      - name: Share the WASM with the SDK job
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: out/${{ env.WASM }}

      - name: Write the release notes
        run: |
          {
            echo "Stellar Oracle Shield ${{ github.ref_name }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "out/${WASM}.sha256")\` |"
            echo "| stellar-cli | \`$(stellar --version | grep -oP 'stellar \K\S+' | head -1)\` |"
            echo "| rust | \`$(rustc --version)\` |"
            echo
            echo "Built with:"
            echo "\`\`\`"
            echo "stellar contract build --optimize --package ${PACKAGE} --meta source_repo=github:${{ github.repository }}"
            echo "\`\`\`"
          } > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "out/${WASM}" "out/${WASM}.sha256" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/${{ env.WASM }}

  typescript-sdk:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/typescript-sdk.yml
    with:
      version: ${{ github.ref_name }}
      wasm-artifact: contract-wasm
